# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - oracle

on:
  push:
    branches:
      - main
  workflow_dispatch:

# ★ THIS FILE WAS GENERATED BY AZURE'S DEPLOYMENT CENTER AND THEN CORRECTED, BECAUSE THE
#   GENERATED VERSION COULD NOT BUILD THIS REPOSITORY — AND COULD NOT SAY SO.
#
#   What it did is the default for a single-package Node app: `npm install` and
#   `npm run build --if-present` at the repository root, then upload `path: .` — the entire
#   checkout — as the deployment package.
#
#   None of that applies here. The root `package.json` is repository tooling; it has no `build`
#   script at all, so `npm run build --if-present` was a no-op that still exited 0 and the run
#   reported **success**. The app and the API are two independent packages under `app/` and
#   `server/`, and neither one was installed or built. What reached the web app was TypeScript
#   source, with no `dist/` and no startable entry point, so App Service found nothing to run
#   and served its own placeholder page — "your web app is running and waiting for your
#   content": a green deployment and an empty site, with no failed step to point at.
#
# ★ THE TWO JOBS ARE COLLAPSED INTO ONE, so that the build output is still on disk when the
#   deploy step runs. Splitting build from deploy means passing `server/` through an artifact,
#   and whether an artifact root ends up holding `server/…` or the contents of `server/` is
#   precisely the kind of detail that would reproduce an empty deployment without failing
#   anything. One job removes the question.
#
# ★ BOTH HALVES ARE BUILT, AND THE APP IS MOVED INSIDE THE API. `app/` produces a Vite build;
#   `server/` is the process that serves it, because every request the app makes is a relative
#   `/api/...` path and there is no configured base URL that could send it anywhere else. The
#   only thing that ever made those paths resolve was the dev-only Vite proxy, which a built
#   app does not have. `npm run build:web` copies the app into `server/public`; the deployment
#   package is `server/`, carrying `package.json`, `dist/`, `public/` and `node_modules/`, so
#   `npm start` finds `node dist/index.js` and nothing has to be installed at startup. The
#   serving half is the static block in `server/src/app.ts`; the copying half is
#   `server/scripts/copy-web.mjs`.
#
# ★ `app` IS BUILT BEFORE `server` IS STARTED, AND `npm ci` IS USED IN BOTH. `app`'s `prebuild`
#   script regenerates `app/public/oracle/` from the committed extract in `data/oracle/`, and
#   `build:web` refuses to run unless `app/dist/index.html` exists — so a broken app build stops
#   the deployment instead of shipping an API that serves nothing.
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Build the app
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Build the API
        working-directory: server
        run: |
          npm ci
          npm run build

      # ★ LINT RUNS AFTER BOTH BUILDS AND BEFORE THE DEPLOY, AND IT IS A GATE.
      #   `tsc` verifies types; it has no opinion on whether a hook was called
      #   conditionally, whether an effect is missing a dependency, or whether a
      #   promise was left floating. This repo has already been bitten by the first
      #   of those (`useStore()` below an early return in `CombinationPanel`) and the
      #   console was the only detector. Both packages lint clean at `error` severity
      #   today — the remaining findings are warnings, so this step fails only on a
      #   NEW error-level finding. Put it here rather than before the builds so a
      #   compile failure is reported first: a broken build is the more urgent news.
      - name: Lint the app
        working-directory: app
        run: npm run lint

      - name: Lint the API
        working-directory: server
        run: npm run lint

      - name: Serve the app from the API
        working-directory: server
        run: npm run build:web

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'oracle'
          slot-name: 'dev'
          package: server
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_D34B4A5BE671470FBA9598420B7F393A }}
